plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'network.ararat.ark.keystore'
version = '0.0.0'

android {
  namespace "network.ararat.ark.keystore"
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
    // Whether this is a build for development, on an emulator: one that takes a key store with no hardware behind
    // it, and a key from its words out of JavaScript, which is how a test loads a key it knows. A build says so
    // with the Gradle property, as the checks that run on an emulator do, and no other build does either.
    buildConfigField "boolean", "DEVELOPMENT_KEYS", (findProperty("arkKeystoreDevelopment") ?: "false").toString()
  }
  buildFeatures {
    buildConfig true
  }
  // The C core in ../native, built with the NDK the app's own build names, so every native library in the app
  // shares one C runtime.
  if (rootProject.hasProperty("ndkVersion")) {
    ndkVersion rootProject.ext.ndkVersion
  }
  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
      // Named, so the build takes this CMake from the Android SDK, fetching it if it must, and never whichever
      // `cmake` happens to be on the PATH.
      version "3.22.1"
    }
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // The system's fingerprint, face, and screen-lock prompt, over every Android the app runs on.
  implementation "androidx.biometric:biometric:1.1.0"
}
