version: 2
updates:
  # Actions are pinned by commit with the version as a trailing comment, so a
  # tag moving under a workflow cannot change what runs; these bumps move the
  # commit and the comment together, all in one pull request.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"

  # Each package has its own lockfile, so each gets its own entry and its own
  # weekly pull request. The signer's is reviewed by its owners.
  - package-ecosystem: npm
    directory: "/signer"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      signer:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      app:
        patterns:
          - "*"
