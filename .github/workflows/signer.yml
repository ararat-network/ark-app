name: signer

# Lints, type-checks, and tests the signer package from its own directory,
# with its own lockfile. It holds no credential and needs none.
on:
  push:
    branches: [main]
    paths: ["signer/**", ".github/workflows/signer.yml"]
  pull_request:
    paths: ["signer/**", ".github/workflows/signer.yml"]

permissions:
  contents: read

concurrency:
  group: signer-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: signer

jobs:
  lint:
    name: "signer: lint and format"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: "signer: type check and tests (Node ${{ matrix.node }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
