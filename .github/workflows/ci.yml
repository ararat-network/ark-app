name: ci

# One workflow for every package. It always runs, works out which packages a
# change touches, and runs only those packages' jobs, each from its own
# directory with its own lockfile. The last job, `ci`, passes when every job
# that ran passed, and is the one check the main ruleset requires: a package
# whose jobs were skipped cannot leave a required check waiting, and adding a
# package never changes the ruleset. It holds no credential and needs none.
#
# To add a package: name it in the `changes` job, add its jobs with the same
# `if`, and list them in the `ci` job's `needs`.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Packages changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      signer: ${{ steps.changed.outputs.signer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: .github/scripts/changed-packages.sh "$BASE" signer | tee -a "$GITHUB_OUTPUT"

  signer-lint:
    name: "signer: lint and format"
    needs: changes
    if: needs.changes.outputs.signer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: signer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  signer-fixtures:
    name: "signer: fixtures match ark at ARK_VERSION"
    needs: changes
    if: needs.changes.outputs.signer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: signer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm fixtures:check

  signer-test:
    name: "signer: type check and tests (Node ${{ matrix.node }})"
    needs: changes
    if: needs.changes.outputs.signer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: signer
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  signer-ledger:
    name: "signer: Ledger adapter on the emulator"
    needs: changes
    if: needs.changes.outputs.signer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: signer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Runs the Ark device app in Docker, from the binaries of a ledger-ark
      # release checked against the SHA-256 pinned here, and fails unless the
      # exchanges it records are the ones the unit tests replay.
      - run: pnpm test:emulator:record

  ci:
    # The main ruleset requires this check by name.
    name: ci
    needs: [changes, signer-lint, signer-fixtures, signer-test, signer-ledger]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
