name: ci

# One workflow for every package. It always runs, works out which packages a
# change touches, and runs only those packages' jobs, each from its own
# directory with its own lockfile. The last job, `ci`, passes when every job
# passed or was skipped for a package the change does not touch, and is the
# one check the main ruleset requires: a package whose jobs were skipped
# cannot leave a required check waiting, and adding a package never changes
# the ruleset. It holds no credential and needs none.
#
# To add a package: name it in the `changes` job, add its jobs with the same
# `if`, and list them in the `ci` job's `needs`.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Packages changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      signer: ${{ steps.changed.outputs.signer }}
      app: ${{ steps.changed.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: .github/scripts/changed-packages.sh "$BASE" signer app | tee -a "$GITHUB_OUTPUT"

  signer-lint:
    name: "signer: lint and format"
    needs: changes
    if: needs.changes.outputs.signer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: signer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  signer-fixtures:
    name: "signer: fixtures match ark at ARK_VERSION"
    needs: changes
    if: needs.changes.outputs.signer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: signer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm fixtures:check

  signer-secp256k1:
    name: "signer: libsecp256k1 is the pinned release"
    needs: changes
    if: needs.changes.outputs.signer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: signer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Fetches the release at the tag in keystore/native/SECP256K1_VERSION, refuses a tag that is not the commit
      # named beside it, and fails unless the copy the keystore is built from is that release's, file for file.
      - run: pnpm secp256k1:check

  signer-test:
    name: "signer: type check and tests (Node ${{ matrix.node }})"
    needs: changes
    if: needs.changes.outputs.signer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: signer
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  signer-ledger:
    name: "signer: Ledger adapter on the emulator"
    needs: changes
    if: needs.changes.outputs.signer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: signer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Runs the Ark device app in Docker, from the binaries of a ledger-ark
      # release checked against the SHA-256 pinned here, and fails unless the
      # exchanges it records are the ones the unit tests replay.
      - run: pnpm test:emulator:record

  app-lint:
    name: "app: lint and format"
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  app-test:
    name: "app: type check and tests (Node ${{ matrix.node }})"
    needs: changes
    # The app type-checks against the signer's source, so a change to either package runs this.
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.signer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The app takes the signer by path, and a package taken by path brings none of its own dependencies. The
      # signer's are installed where its source looks for them: those it runs with, and not those it is developed with.
      - run: pnpm install --frozen-lockfile --prod
        working-directory: signer
      - run: pnpm check
      - run: pnpm test

  # The two jobs below generate the native project from the app's config,
  # build it, install it on a simulator or an emulator, start it, and fail
  # unless the device's log shows the signer's keystore passing its checks
  # there: its C core answering rightly, and a key made, signed with twice,
  # and removed, through Swift on iOS and Kotlin on Android. On the emulator
  # that is behind a PIN the check sets and types into the system's prompt.
  # The native code they build is the signer's, so a change to either package
  # runs them.
  app-ios:
    name: "app: builds and calls native code on iOS"
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.signer == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The app takes the signer by path, and a package taken by path brings none of its own dependencies. The
      # signer's are installed where its source looks for them: those it runs with, and not those it is developed with.
      - run: pnpm install --frozen-lockfile --prod
        working-directory: signer
      - name: Boot a simulator
        run: |
          xcodebuild -version
          device=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for r in json.load(sys.stdin)["devices"].values() for d in r if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
      - run: pnpm check:ios
        env:
          CI: "1"

  app-android:
    name: "app: builds and calls native code on Android"
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.signer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: 17
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The app takes the signer by path, and a package taken by path brings none of its own dependencies. The
      # signer's are installed where its source looks for them: those it runs with, and not those it is developed with.
      - run: pnpm install --frozen-lockfile --prod
        working-directory: signer
      # The emulator needs hardware virtualisation, which the runner has once its device is opened to the runner's user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          working-directory: app
          script: pnpm check:android
        env:
          CI: "1"

  ci:
    # The main ruleset requires this check by name.
    name: ci
    needs: [changes, signer-lint, signer-fixtures, signer-secp256k1, signer-test, signer-ledger, app-lint, app-test, app-ios, app-android]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only the two results named pass. Any other fails, the ones GitHub documents and the ones it does not: a job no
      # runner ever took is reported here as `abandoned`, and a check that looked for `failure` and `cancelled` passed it.
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a job ended as '$result'"
                exit 1
                ;;
            esac
          done
